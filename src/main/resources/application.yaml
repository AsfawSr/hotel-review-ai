spring:
  application:
    name: hotel-review-ai

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_review_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    locations: classpath:db/migration
    # Databases previously managed by ddl-auto have no history table; treat them as already at V1.
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      vector_dimensions: ${PGVECTOR_DIMENSIONS:768}

  thymeleaf:
    cache: false

  # Applies to every RestClient.Builder, including the Ollama client and the AI status check.
  http:
    client:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_READ_TIMEOUT:120s}

  security:
    user:
      name: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD}
      roles: ADMIN

  ai:
    model:
      # ollama (local, default) or openai (any OpenAI-compatible API, e.g. OpenAI or Groq).
      chat: ${AI_CHAT_PROVIDER:ollama}
      embedding: ${AI_EMBEDDING_PROVIDER:ollama}
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${AI_TEMPERATURE:0.2}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:latest}
          temperature: ${OLLAMA_TEMPERATURE:0.2}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    vectorstore:
      # Off by default so the app starts without the pgvector extension; the "rag" profile switches it on.
      type: none
      pgvector:
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: ${PGVECTOR_DIMENSIONS:768}
        # Schema is managed by Flyway (db/vector).
        initialize-schema: false
        remove-existing-vector-store-table: false

app:
  rag:
    enabled: false
    top-k: 5
    similarity-threshold: 0.7
    seed-sample-policies: true
    reindex-on-startup: false
  analysis:
    recovery-interval: PT1M
    pending-grace: PT2M
    processing-timeout: PT10M
    recovery-batch-size: 20
    ai-max-attempts: 2
    ai-retry-backoff: PT2S

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    root: INFO
    org.springframework.ai: INFO
    com.asfaw.review_ai: DEBUG

management:
  endpoints:
    web:
      exposure:
        # health/info are public; metrics/prometheus require login (scrape from a trusted network).
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        analysis.duration: true

---
# RAG over hotel policies: requires the pgvector extension and the embedding model.
# Activate with SPRING_PROFILES_ACTIVE=rag (combine with others, e.g. "dev,rag").
spring:
  config:
    activate:
      on-profile: rag
  flyway:
    locations: classpath:db/migration,classpath:db/vector
  ai:
    vectorstore:
      type: pgvector

app:
  rag:
    enabled: true
    reindex-on-startup: true
