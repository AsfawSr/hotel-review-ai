spring:
  datasource:
    url: jdbc:h2:mem:review_ai_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # Flyway builds the schema; validate proves migrations and entities agree.
      ddl-auto: validate

  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    vectorstore:
      type: none

app:
  # All MockMvc requests share one IP; RateLimitFilterTest covers limiting directly.
  rate-limit:
    enabled: false
  security:
    admin:
      username: admin
      password: test-password

