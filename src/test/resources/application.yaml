spring:
  datasource:
    url: jdbc:h2:mem:review_ai_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # Flyway builds the schema; validate proves migrations and entities agree.
      ddl-auto: validate

  security:
    user:
      name: admin
      password: test-password
      roles: ADMIN

  ai:
    model:
      chat: none
      embedding: none
    vectorstore:
      type: none

